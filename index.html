<!DOCTYPE html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="google" content="notranslate" />
    <title>贪吃蛇 · Snake</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Ccircle cx='10' cy='16' r='4' fill='%2334d399'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2310b981'/%3E%3Ccircle cx='22' cy='12' r='4' fill='%23059669'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%23fb7185'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>贪吃蛇</h1>
            <p class="subtitle">Snake</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">得分</span>
            <span class="stat-value" id="score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">最高</span>
            <span class="stat-value" id="high-score">0</span>
          </div>
        </div>
        <button type="button" class="btn ghost" id="pause-btn" disabled>暂停</button>
      </header>

      <main class="stage">
        <div class="board-wrap">
          <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
          <div class="overlay" id="overlay">
            <div class="overlay-card" id="overlay-card">
              <p class="overlay-kicker" id="overlay-kicker">准备开始</p>
              <h2 id="overlay-title">经典贪吃蛇</h2>
              <p class="overlay-copy" id="overlay-copy">方向键或 WASD 控制，吃到食物变长并得分。撞墙或撞到自己即结束。</p>
              <button type="button" class="btn primary" id="start-btn">开始游戏</button>
            </div>
          </div>
        </div>
      </main>

      <section class="controls" aria-label="触控方向键">
        <div class="dpad">
          <button type="button" class="pad" data-dir="up" aria-label="向上">↑</button>
          <button type="button" class="pad" data-dir="left" aria-label="向左">←</button>
          <button type="button" class="pad" data-dir="down" aria-label="向下">↓</button>
          <button type="button" class="pad" data-dir="right" aria-label="向右">→</button>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="restart-btn">重新开始</button>
          <p class="hint">方向键 / WASD　空格重开　P 暂停　滑动转向</p>
        </div>
      </section>
    </div>
    <script src="game.js"></script>
  </body>
</html>
